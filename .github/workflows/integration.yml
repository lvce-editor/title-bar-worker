name: Integration
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 7a7eed99bfd6dd54a2d5c037779e5c6ac6812a9e
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Build application static export
        working-directory: .tmp/lvce-integration
        run: npm run build:static:ignore-icon-theme
        env:
          PATH_PREFIX: /lvce-editor
      - name: Include unsupported-folder browser test in static export
        run: |
          test_module=packages/e2e-integration/src/viewlet.title-bar-open-folder-unsupported.js
          export_dir=.tmp/lvce-integration/packages/build/.tmp/export-test/dist/packages/extension-host-worker-tests/src
          mkdir -p "$export_dir"
          cp "$test_module" "$export_dir/"
      - name: Build server and verify static export
        working-directory: .tmp/lvce-integration
        run: |-
          npm run build:server
          npm run test-static-export
      - name: Test menu highlight on mouse leave
        run: node packages/e2e/scripts/test-menu-mouse-leave.mjs .tmp/lvce-integration
        shell: bash
      - name: Test unsupported local folder dialog
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --filter=viewlet.title-bar-open-folder-unsupported
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Install Linux window manager
        if: matrix.os == 'ubuntu-24.04'
        run: |-
          sudo apt-get update
          sudo apt-get install -y openbox xvfb xdotool
      - name: Build Electron application
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .tmp/lvce-integration
        run: npm run build:electron:deb
      - name: Test native About dialog dismissal clears menu highlight
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh -c 'openbox & wm_pid=$!; node packages/extension-host-worker-tests/scripts/test-help-about-dialog.mjs; result=$?; kill "$wm_pid"; exit "$result"'
        working-directory: .tmp/lvce-integration
        shell: bash
      - name: Test Linux titlebarless Electron layout
        if: matrix.os == 'ubuntu-24.04'
        run:
          xvfb-run -a sh -c 'openbox & wm_pid=$!; node packages/extension-host-worker-tests/scripts/test-titlebarless.mjs; result=$?; kill "$wm_pid"; exit
          "$result"'
        working-directory: .tmp/lvce-integration
        shell: bash
      - name: Test menu widgets with active editor content
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: |
          npm run e2e:headless -- --filter=title-bar-menu-file-search-space
          npm run e2e:headless -- --filter=title-bar-menu-close-on-click-outside
          npm run e2e:headless -- --filter=title-bar-menu-root-lifecycle
        shell: bash
      - name: Test title bar after expanded browser fullscreen
        if: matrix.os == 'ubuntu-24.04'
        run: |
          xvfb-run -a sh -c 'openbox & wm_pid=$!; node packages/extension-host-worker-tests/scripts/test-titlebar-reference.mjs; result=$?; kill "$wm_pid"; exit "$result"'
        working-directory: .tmp/lvce-integration
        shell: bash
      - name: Test Electron app-region styles
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a sh -c 'openbox & wm_pid=$!; node packages/extension-host-worker-tests/scripts/test-titlebar-app-regions.mjs; result=$?; kill "$wm_pid"; exit "$result"'
        working-directory: .tmp/lvce-integration
        shell: bash
